<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260">
  <defs>
    <style type="text/css">
      .label-phase { font-family: Helvetica, Arial, sans-serif; font-size: 10px; fill: #333; text-transform: uppercase; text-anchor: middle; }
      .label-bold { font-family: Helvetica, Arial, sans-serif; font-weight: bold; font-size: 16px; fill: #000; text-anchor: middle; }
      .label-italic { font-family: Helvetica, Arial, sans-serif; font-style: italic; font-size: 11px; fill: #424242; text-anchor: middle; }
      .label-risk-low { font-family: Helvetica, Arial, sans-serif; font-weight: bold; font-size: 12px; fill: #16a34a; text-anchor: middle; }
      .label-risk-med { font-family: Helvetica, Arial, sans-serif; font-weight: bold; font-size: 12px; fill: #f59e0b; text-anchor: middle; }
      .note-text { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #424242; text-anchor: middle; }
    </style>
  </defs>
  <rect width="850" height="260" fill="#fff"/>
  
  <rect x="40" y="40" width="160" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="65" class="label-phase">Phase 1</text>
  <text x="120" y="85" class="label-bold">Provision</text>
  <text x="120" y="105" class="label-italic">Week 1-2</text>
  <text x="120" y="125" class="label-risk-low">Risk: Low</text>
  
  <rect x="240" y="40" width="160" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="65" class="label-phase">Phase 2</text>
  <text x="320" y="85" class="label-bold">Update Collectors</text>
  <text x="320" y="105" class="label-italic">Week 3-6</text>
  <text x="320" y="125" class="label-risk-med">Risk: Medium</text>
  
  <rect x="440" y="40" width="160" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="520" y="65" class="label-phase">Phase 3</text>
  <text x="520" y="85" class="label-bold">Migrate Assets</text>
  <text x="520" y="105" class="label-italic">Week 7-10</text>
  <text x="520" y="125" class="label-risk-med">Risk: Medium</text>
  
  <rect x="640" y="40" width="160" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="65" class="label-phase">Phase 4</text>
  <text x="720" y="85" class="label-bold">Deprecate</text>
  <text x="720" y="105" class="label-italic">Week 11+</text>
  <text x="720" y="125" class="label-risk-low">Risk: Low</text>
  
  <path d="M 200 90 L 240 90" stroke="#0d47a1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 400 90 L 440 90" stroke="#0d47a1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 600 90 L 640 90" stroke="#0d47a1" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="260" y="180" width="320" height="60" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="420" y="205" class="note-text">Old and new stacks run in parallel.</text>
  <text x="420" y="225" class="note-text">Rollback possible through Phase 3.</text>
  
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#0d47a1" />
  </marker>
</svg>
