<text x="73" y="969.25" font-family="Helvetica,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">One structural change, four unchanged segments — minimal naming-system disruption.</text>
<text x="73" y="992.125" font-family="Helvetica,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#CBD5E1" text-anchor="start">Provider, Region, and Index conventions are inherited verbatim from Pattern 005. Only the third segment changes — Product ID → BU.</text>
