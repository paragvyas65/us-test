<text x="108" y="665.25" font-family="Helvetica,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#D97706" text-anchor="start">⚠  IMPORTANT — Why env is NOT in the stack name</text>
<text x="68" y="697.125" font-family="Helvetica,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#0F1F3F" text-anchor="start">In BOTH Pattern 005 AND Pattern 006, environment (Dev / Stage / Prod) is a telemetry LABEL — NOT a separate stack.</text>
<text x="68" y="717.125" font-family="Helvetica,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start">✓  This label-based approach is what enables Pattern 006's native cross-tier views — Dev/Stage/Prod for the same BU coexist in one stack and are filtered logically at query time.</text>
<text x="68" y="741.125" font-family="Helvetica,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#D97706" text-anchor="start">⚠  Common misconception:  &quot;env was removed in Pattern 006&quot;.  Reality: env was NEVER in the stack name — neither in 005 nor 006.</text>
<rect x="1290" y="678" width="410" height="78" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1" stroke-dasharray="3,2"/>
