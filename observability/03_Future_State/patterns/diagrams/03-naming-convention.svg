<text x="1495.0" y="716.75" font-family="Helvetica,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" font-style="italic" fill="#475569" text-anchor="middle">Vladimir suggested 'Tier' instead of 'env'</text>
<text x="1495.0" y="736.75" font-family="Helvetica,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#0F1F3F" text-anchor="middle">Position: stick with env (OTel standard)</text>
