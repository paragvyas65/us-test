# Basic configuration for Kong Enterprise without the ingress controller, using the Postgres subchart
# This installation does not create an Ingress or LoadBalancer Service for
# the Admin API. It requires port-forwards to access without further
# configuration to add them, e.g.:
# kubectl port-forward deploy/your-deployment-kong 8001:8001
# Before installing:
# * Several settings (search for the string "CHANGEME") require user-provided
#   Secrets. These Secrets must be created before installation.
# * Ensure that your session configurations create cookies that are usable
#   across your services. The admin session configuration must create cookies
#   that are sent to both the admin API and Kong Manager, and any Dev Portal
#   instances with authentication must create cookies that are sent to both
#   the Portal and Portal API.

image:
  repository: kong/kong-gateway
  tag: '2.8'

secretVolumes:
  - kong-cluster-cert #Self/KongSigned
  - kong-cluster-cert2 #PKI

env:
  database: postgres
  role: control_plane
  cluster_cert: /etc/secrets/kong-cluster-cert/tls.crt
  cluster_cert_key: /etc/secrets/kong-cluster-cert/tls.key
  admin_ssl_cert: /etc/secrets/kong-cluster-cert2/tls.crt
  admin_ssl_cert_key: /etc/secrets/kong-cluster-cert2/tls.key
  admin_gui_ssl_cert: /etc/secrets/kong-cluster-cert2/tls.crt
  admin_gui_ssl_cert_key: /etc/secrets/kong-cluster-cert2/tls.key
  pg_host: k-cp-tmp.postgres.database.azure.com
  pg_port: 5432
  pg_user: adminpg
  pg_password: BgyX9weCNc8Dsku9
  pg_database: kong
  pg_ssl: on
  pg_ssl_version: tlsv1_2
  cluster_telemetry_listen: 0.0.0.0:8006
  cluster_listen: 0.0.0.0:8005
  route_validation_strategy: path
  enforce_route_path_pattern: /$(workspace)/.*
  admin_gui_url: https://manager.kong.pintc010040040201050a001.img.azr.fusionoperate.io:8445
  admin_api_uri: https://admin.kong.pintc010040040201050a001.img.azr.fusionoperate.io:8444
  password: test

ingressController:
  enabled: true
  installCRDs: false
  env:
    kong_admin_token:
      valueFrom:
        secretKeyRef:
          name: kong-enterprise-superuser-password
          key: password
  resources: {}

proxy:
  enabled: false

enterprise:
  enabled: true
  # See instructions regarding enterprise licenses at https://github.com/Kong/charts/blob/master/charts/kong/README.md#kong-enterprise-license
  license_secret: kong-gateway-license
  vitals:
    enabled: true
  portal:
    enabled: true
  rbac:
    enabled: true
    enforce_rbac: on
    admin_gui_auth: openid-connect
    admin_gui_auth_conf_secret: kong-manager-conf
    session_conf_secret: kong-session-config

portal:
  enabled: true

portalapi:
  enabled: true

manager:
  enabled: true
  type: LoadBalancer
  tls:
    enabled: true
    servicePort: 8445
    containerPort: 8445
    parameters: []
  labels:
    enable-metrics: 'true'
  ingress:
    enabled: true
    ingressClassName: kong
    tls: kong-cluster-cert2
    hostname: manager.kong.pintc010040040201050a001.img.azr.fusionoperate.io
    path: /default/.*
  annotations:
    kubernetes.io/skip-dns-registration: 'true'
    konghq.com/strip-path: 'true'
    service.beta.kubernetes.io/azure-load-balancer-internal: 'true'
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: pintc010040040201050f001

admin:
  enabled: true
  type: LoadBalancer
  tls:
    enabled: true
    servicePort: 8444
    containerPort: 8444
    parameters: []
  ingress:
    enabled: true
    ingressClassName: kong
    tls: kong-cluster-cert2
    hostname: admin.kong.pintc010040040201050a001.img.azr.fusionoperate.io
    path: /default/.*
  annotations:
    kubernetes.io/skip-dns-registration: 'true'
    konghq.com/strip-path: 'true'
    service.beta.kubernetes.io/azure-load-balancer-internal: 'true'
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: pintc010040040201050f001

cluster:
  enabled: true
  type: LoadBalancer
  tls:
    enabled: true
    servicePort: 8005
    containerPort: 8005
  ingress:
    enabled: false
  annotations:
    kubernetes.io/skip-dns-registration: 'true'

clustertelemetry:
  enabled: true
  type: LoadBalancer
  tls:
    enabled: true
    servicePort: 8006
    containerPort: 8006
  ingress:
    enabled: false
  annotations:
    kubernetes.io/skip-dns-registration: 'true'
