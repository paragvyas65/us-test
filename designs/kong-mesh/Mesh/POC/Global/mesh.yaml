apiVersion: kuma.io/v1alpha1
kind: Mesh
metadata:
  name: default
spec:
  routing:
    localityAwareLoadBalancing: true
  logging:
    backends:
      - conf:
          path: /tmp/access.log
        name: file
        type: file
    defaultBackend: file
  mtls:
    backends:
      - conf:
          caCert:
            RSAbits: 2048
            expiration: 10y
        dpCert:
          rotation:
            expiration: 1d
        name: ca-1
        type: builtin
    enabledBackend: ca-1
  networking:
    outbound:
      passthrough: true
---
apiVersion: kuma.io/v1alpha1
kind: TrafficLog
metadata:
  name: all-traffic
mesh: default
spec:
  sources:
    - match:
        kuma.io/service: '*'
  destinations:
    - match:
        kuma.io/service: '*'
