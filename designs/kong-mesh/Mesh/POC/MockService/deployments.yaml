apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-deployment
  namespace: kong-mesh-test
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: echo-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp:
      labels:
        app: echo-server
    spec:
      containers:
        - image: jmalloc/echo-server
          imagePullPolicy: Always
          name: echo-server
          ports:
            - containerPort: 8080
              name: http-port
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
        - image: nicolaka/netshoot
          imagePullPolicy: Always
          name: network-debug
          command:
            - /bin/sleep
            - infinity
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
